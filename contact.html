<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Contact — Aumakua Defense</title>
  <meta name="description" content="Contact Aumakua Defense. Phone, email, address, and hours have not been published.">
  <link rel="canonical" href="https://aumakuadefense.clientreview.co/contact.html">
  <link rel="icon" href="assets/logo/aumakua-mark-white.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="contact">
  <main id="main">
    <div class="page">
      <p class="kicker">Contact</p>
      <h1>Drop us a line</h1>
      <p class="review-note">Draft: Rewrite of the live signup form. This prototype does not send the message.</p>
      <div class="chip-row">
        <span class="supply-chip">Phone — client to supply</span>
        <span class="supply-chip">Email — client to supply</span>
        <span class="supply-chip">Address — client to supply</span>
        <span class="supply-chip">Hours — client to supply</span>
      </div>
      <form id="contact-form">
        <label>Name <input name="name" required autocomplete="name"></label>
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Message <textarea name="message" required></textarea></label>
        <label class="check"><input type="checkbox" name="list" value="yes"> Sign up for the email list for updates.</label>
        <p class="review-note">The email list is not connected yet.</p>
        <button class="btn" type="submit">Send</button>
        <p id="contact-status" class="form-status" role="status"></p>
      </form>
    </div>
  </main>
  <script src="js/site.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
